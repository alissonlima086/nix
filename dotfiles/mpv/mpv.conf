# =========================
# Video Output
# =========================

vo=gpu-next
gpu-api=vulkan

# Sincronização com monitor
video-sync=display-resample


# =========================
# Quality
# =========================

scale=ewa_lanczossharp
cscale=ewa_lanczossharp

# Melhor qualidade para downscale
dscale=mitchell


# =========================
# Hardware acceleration
# =========================

hwdec=auto-safe


# =========================
# Interface
# =========================

osc=no


border=no
keep-open=yes

# Tamanho inicial da janela
autofit=70%


# =========================
# Subtitles
# =========================

sub-auto=fuzzy
sub-font-size=42
sub-border-size=2
sub-shadow-offset=2


# =========================
# Audio
# =========================

audio-pitch-correction=yes
volume-max=130
